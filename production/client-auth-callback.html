<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Menyiapkan Client Portal | Soul Mitra Abadi</title>
  <link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
  <script type="module" src="/src/main-v4.js"></script>
</head>
<body>
  <main class="client-auth client-auth-status" data-client-auth-page="callback">
    <section class="client-callback-card" aria-live="polite" aria-busy="true">
      <span class="client-auth-brand-mark" aria-hidden="true">SMA</span>
      <div class="client-auth-spinner" aria-hidden="true"></div>
      <h1 data-callback-title>Menyiapkan portal kamu</h1>
      <p data-callback-message>Kami sedang memverifikasi sesi dan menyiapkan profil.</p>
      <div class="client-callback-actions">
        <button type="button" class="client-auth-primary" data-callback-retry hidden>Coba lagi</button>
        <button type="button" class="client-auth-secondary" data-client-logout hidden>Keluar</button>
        <a href="client-portal-login.html">Kembali ke halaman masuk</a>
      </div>
    </section>
  </main>
</body>
</html>
