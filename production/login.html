<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk | SMA-app</title>
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script type="module" src="/src/main-v4.js"></script>
</head>
<body class="staff-login">

<div class="staff-login__grid" aria-hidden="true"></div>
<div class="staff-login__shade" aria-hidden="true"></div>
<div class="staff-login__scanline" aria-hidden="true"></div>

<main class="auth-page staff-login__page" data-auth="otp">
  <section class="auth-card staff-login__card">
    <span class="staff-login__ribbon staff-login__ribbon--top-left" aria-hidden="true"></span>
    <span class="staff-login__ribbon staff-login__ribbon--top-right" aria-hidden="true"></span>
    <span class="staff-login__ribbon staff-login__ribbon--bottom-left" aria-hidden="true"></span>
    <span class="staff-login__ribbon staff-login__ribbon--bottom-right" aria-hidden="true"></span>

    <header class="auth-brand staff-login__brand">
      <img class="staff-login__logo" src="../images/logo-sma.png" alt="Soul Mitra Abadi">
      <div class="staff-login__brand-name">Soul Mitra Abadi</div>
      <div class="staff-login__brand-subtitle">Client Management System</div>
    </header>

    <!-- STEP 1: email -->
    <div id="otp-email-step">
      <div class="staff-login__title-block">
        <h1 class="auth-title staff-login__title">Masuk ke Sistem</h1>
        <p class="auth-subtitle staff-login__subtitle">&gt; Masukkan email untuk mendapatkan kode verifikasi</p>
      </div>

      <form id="otp-email-form">
        <div class="form-group">
          <label class="form-label" for="otp-email">Email</label>
          <div class="input-group">
            <svg class="input-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M2 5l6 4 6-4"/></svg>
            <input type="email" id="otp-email" class="form-control" placeholder="kamu@soulmitra.id" required autocomplete="email">
          </div>
        </div>

        <button type="submit" class="btn staff-login__submit">
          Kirim kode
        </button>
      </form>
    </div>

    <!-- STEP 2: 6-digit code -->
    <div id="otp-code-step" style="display:none">
      <div class="staff-login__title-block">
        <h1 class="auth-title staff-login__title">Cek Email Kamu</h1>
        <p class="auth-subtitle staff-login__subtitle">&gt; Kode 6 digit dikirim ke <strong id="otp-email-display"></strong></p>
      </div>

      <form id="otp-code-form">
        <div class="form-group">
          <label class="form-label" for="otp-code">Kode Verifikasi</label>
          <div class="input-group">
            <svg class="input-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5 7V5a3 3 0 016 0v2"/></svg>
            <input type="text" id="otp-code" class="form-control" placeholder="123456" inputmode="numeric" pattern="[0-9]*" maxlength="6" required autocomplete="one-time-code">
          </div>
        </div>

        <button type="submit" class="btn staff-login__submit">
          Verifikasi
        </button>
      </form>

      <div class="auth-actions staff-login__actions">
        <button type="button" id="otp-back" class="staff-login__link">&larr; Ganti email</button>
        <button type="button" id="otp-resend" class="staff-login__link staff-login__link--accent">Kirim ulang kode</button>
      </div>
    </div>

    <footer class="auth-footer staff-login__footer">
      Belum punya akun? Hubungi admin SMA untuk diundang.
    </footer>
  </section>
</main>

</body>
</html>
